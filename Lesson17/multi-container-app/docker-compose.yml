version: '3.8'

services:
  web:
    build: .
    ports:
      - "8081:80"
    networks:
      - appnet


  db:
    image: postgres:alpine
    container_name: database
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    networks:
      - appnet
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: cash
    networks:
      - appnet
    volumes:
      - web-data:/usr/share/nginx/html

networks:
  appnet:

volumes:
  web-data:
  db-data: